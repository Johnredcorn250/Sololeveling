<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#220901">
    <title>GYMLOG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            /* Inferno Color Palette */
            --bg: #220901;         
            --surface: #621708;    
            --surface-2: #941B0C;  
            --accent: #F6AA1C;     
            --accent-alt: #BC3908; 
            --border: rgba(246, 170, 28, 0.15);
            --text: #f5f1ea;
            --text-muted: #d1b8b0;
            --display: 'Anton', sans-serif;
            --body: 'Manrope', sans-serif;
            --mono: 'JetBrains Mono', monospace;

            /* Rank Colors */
            --rank-s: #F6AA1C;
            --rank-a: #BC3908;
            --rank-b: #941B0C;
            --rank-c: #ffbb00;
            --rank-d: #888888;
            --rank-e: #555555;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--body);
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(246, 170, 28, 0.08) 0%, transparent 50%);
        }

        .app { max-width: 540px; margin: 0 auto; padding: 20px; }

        .header { padding: 20px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
        .logo { font-family: var(--display); font-size: 38px; color: var(--text); }
        .logo span { color: var(--accent); text-shadow: 0 0 15px rgba(246, 170, 28, 0.4); }

        .tabs { display: flex; gap: 4px; margin: 20px 0; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 999px; border: 1px solid var(--border); }
        .tab { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); font-family: var(--body); font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 999px; cursor: pointer; }
        .tab.active { background: var(--accent); color: var(--bg); }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; }

        /* MANNEQUIN */
        .muscle { fill: #3a1109; stroke: #220901; stroke-width: 0.8; transition: fill 0.4s ease; }
        .muscle.active { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }

        .btn { background: var(--accent); color: var(--bg); border: none; padding: 15px; border-radius: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px; }
        .field { margin-bottom: 15px; }
        .field label { font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--surface-2); color: white; padding: 12px; border-radius: 8px; font-family: var(--body); }

        .rank-display { font-family: var(--display); font-size: 80px; line-height: 1; }
        .history-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--accent-alt); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo">GYM<span>LOG</span></div>
        <div id="todayDate" style="font-family: var(--mono); font-size: 11px;"></div>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="today">Today</button>
        <button class="tab" data-tab="stretches">Recovery</button>
        <button class="tab" data-tab="history">Archives</button>
    </div>

    <!-- TODAY -->
    <div id="view-today">
        <div class="card" style="text-align:center">
            <div id="timerDisplay" style="font-family: var(--mono); font-size: 40px;">00:00:00</div>
            <button class="btn" id="timerBtn">Awaken</button>
        </div>

        <div class="card" style="display:flex; align-items:center; gap:20px;">
            <div id="bodyFigure" style="width:110px">
                <!-- SVG RESTORED -->
                <svg viewBox="0 0 200 440" xmlns="http://www.w3.org/2000/svg">
                    <g transform-origin="100 430">
                        <ellipse cx="100" cy="34" rx="19" ry="23" class="muscle"/>
                        <path d="M 90 70 Q 76 74 64 84 Q 78 82 100 80 Q 122 82 136 84 Q 124 74 110 70 Z" class="muscle" data-zone="Back"/>
                        <path d="M 64 84 Q 48 90 46 110 Q 50 122 68 118 Q 78 104 82 92 Q 76 84 64 84 Z" class="muscle" data-zone="Shoulders"/>
                        <path d="M 136 84 Q 152 90 154 110 Q 150 122 132 118 Q 122 104 118 92 Q 124 84 136 84 Z" class="muscle" data-zone="Shoulders"/>
                        <path d="M 82 90 Q 70 98 68 132 Q 76 148 98 148 L 99 104 Q 96 92 82 90 Z" class="muscle" data-zone="Chest"/>
                        <path d="M 118 90 Q 130 98 132 132 Q 124 148 102 148 L 101 104 Q 104 92 118 90 Z" class="muscle" data-zone="Chest"/>
                        <path d="M 46 110 Q 38 132 40 168 Q 50 174 60 170 Q 64 146 64 116 Q 56 110 46 110 Z" class="muscle" data-zone="Arms"/>
                        <path d="M 154 110 Q 162 132 160 168 Q 150 174 140 170 Q 136 146 136 116 Q 144 110 154 110 Z" class="muscle" data-zone="Arms"/>
                        <path d="M 84 150 Q 84 216 116 216 Q 116 150 100 150 Z" class="muscle" data-zone="Core"/>
                        <path d="M 86 248 Q 76 290 78 332 L 82 342 Q 96 346 99 342 L 99 250 Z" class="muscle" data-zone="Legs"/>
                        <path d="M 114 248 Q 124 290 122 332 L 118 342 Q 104 346 101 342 L 101 250 Z" class="muscle" data-zone="Legs"/>
                        <path d="M 82 354 Q 78 388 84 422 L 96 422 L 97 354 Z" class="muscle" data-zone="Legs"/>
                        <path d="M 118 354 Q 122 388 116 422 L 104 422 L 103 354 Z" class="muscle" data-zone="Legs"/>
                    </g>
                </svg>
            </div>
            <div id="workedSummary" style="flex:1"></div>
        </div>

        <div class="card">
            <div class="field"><label>Exercise</label><input type="text" id="exName"></div>
            <div style="display:flex; gap:10px">
                <div class="field" style="flex:1"><label>Target</label>
                    <select id="exBodyPart">
                        <option>Chest</option><option>Back</option><option>Shoulders</option><option>Arms</option><option>Legs</option><option>Core</option>
                    </select>
                </div>
                <div class="field" style="flex:1"><label>KG</label><input type="number" id="exWeight"></div>
            </div>
            <button class="btn" id="addExBtn">Log Combat Data</button>
        </div>
        <div id="todayList" style="margin-top:20px"></div>
    </div>

    <!-- STRETCHES -->
    <div id="view-stretches" class="hidden">
        <div id="stretchesContent"></div>
    </div>

    <!-- HISTORY -->
    <div id="view-history" class="hidden">
        <div class="card" style="text-align:center">
            <div id="globalRank" class="rank-display rank-e">E</div>
            <div id="rankSubtitle" style="font-family: var(--mono); font-size: 11px; color: var(--accent)">Awakened</div>
        </div>
        <div class="card"><canvas id="muscleChart"></canvas></div>
        <div id="historyList"></div>
    </div>
</div>

<script>
    let state = { exercises: [], history: [], timerRunning: false, start: null };
    let chart = null;

    const stretchLibrary = {
        "Chest": ["Cobra Pose", "Doorway Stretch"],
        "Back": ["Child's Pose", "Cat-Cow"],
        "Shoulders": ["Cross-Arm Stretch", "Thread the Needle"],
        "Arms": ["Tricep Stretch", "Wrist Stretch"],
        "Legs": ["Pigeon Pose", "Quad Stretch"],
        "Core": ["Sphinx Pose", "Torso Twist"]
    };

    function save() { localStorage.setItem('gymlog_v3', JSON.stringify(state)); }

    function load() {
        const data = localStorage.getItem('gymlog_v3');
        if (data) state = JSON.parse(data);
        renderAll();
    }

    function getRank(w) {
        if (w >= 140) return 'S'; if (w >= 100) return 'A'; if (w >= 70) return 'B';
        if (w >= 40) return 'C'; if (w >= 20) return 'D'; return 'E';
    }

    function renderAll() {
        document.getElementById('todayList').innerHTML = state.exercises.map(ex => `
            <div class="history-item"><b>${ex.name}</b> - ${ex.weight}kg <span style="float:right">${getRank(ex.weight)}</span></div>
        `).join('');

        const worked = new Set(state.exercises.map(e => e.bodyPart));
        document.querySelectorAll('.muscle').forEach(m => {
            if (worked.has(m.dataset.zone)) m.classList.add('active');
            else m.classList.remove('active');
        });

        document.getElementById('historyList').innerHTML = state.history.map(s => `
            <div class="card">
                <div style="font-size:10px; color:var(--accent)">${new Date(s.date).toLocaleDateString()}</div>
                ${s.exercises.map(e => `<div>${e.name} (${e.weight}kg)</div>`).join('')}
            </div>
        `).join('');

        let maxW = 0;
        state.history.forEach(s => s.exercises.forEach(e => { if(e.weight > maxW) maxW = e.weight; }));
        const r = getRank(maxW);
        document.getElementById('globalRank').textContent = r;
        document.getElementById('globalRank').className = `rank-display rank-${r.toLowerCase()}`;
        
        updateChart();
    }

    function updateChart() {
        const ctx = document.getElementById('muscleChart').getContext('2d');
        const parts = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core"];
        const counts = parts.map(p => {
            let c = 0;
            state.history.forEach(s => s.exercises.forEach(e => { if(e.bodyPart === p) c++; }));
            return c;
        });

        if (chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: parts,
                datasets: [{ data: counts, backgroundColor: 'rgba(246, 170, 28, 0.2)', borderColor: '#F6AA1C' }]
            },
            options: { 
                scales: { r: { grid: { color: 'rgba(255,255,255,0.1)'}, ticks: { display: false }, pointLabels: { color: '#aaa' } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function renderStretches() {
        const worked = [...new Set(state.exercises.map(ex => ex.bodyPart))];
        const parts = worked.length > 0 ? worked : ["Legs", "Back"];
        let html = `<h3>RECOVERY</h3>`;
        parts.forEach(p => {
            stretchLibrary[p].forEach(s => html += `<div class="history-item">${s} (${p})</div>`);
        });
        document.getElementById('stretchesContent').innerHTML = html;
    }

    document.getElementById('addExBtn').onclick = () => {
        state.exercises.push({
            name: document.getElementById('exName').value,
            weight: parseFloat(document.getElementById('exWeight').value) || 0,
            bodyPart: document.getElementById('exBodyPart').value
        });
        save(); renderAll();
    };

    document.getElementById('timerBtn').onclick = () => {
        if (!state.timerRunning) {
            state.timerRunning = true;
            state.start = Date.now();
            document.getElementById('timerBtn').textContent = "Finish Session";
            tick();
        } else {
            state.history.unshift({ date: new Date().toISOString(), exercises: [...state.exercises] });
            state.exercises = [];
            state.timerRunning = false;
            document.getElementById('timerBtn').textContent = "Awaken";
            save(); renderAll();
        }
    };

    function tick() {
        if (!state.timerRunning) return;
        const diff = Date.now() - state.start;
        document.getElementById('timerDisplay').textContent = new Date(diff).toISOString().substr(11, 8);
        setTimeout(tick, 1000);
    }

    document.querySelectorAll('.tab').forEach(t => {
        t.onclick = () => {
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('view-today').classList.toggle('hidden', t.dataset.tab !== 'today');
            document.getElementById('view-stretches').classList.toggle('hidden', t.dataset.tab !== 'stretches');
            document.getElementById('view-history').classList.toggle('hidden', t.dataset.tab !== 'history');
            if(t.dataset.tab === 'history') updateChart();
            if(t.dataset.tab === 'stretches') renderStretches();
        }
    });

    load();
    document.getElementById('todayDate').textContent = new Date().toDateString();
</script>
</body>
</html>
