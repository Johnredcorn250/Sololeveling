<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMLOG">
<title>GYMLOG | Solo Leveling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --text: #f5f1ea;
    --text-muted: #888;
    --text-faint: #555;
    --accent: #ff4d1f;
    --accent-light: #ff8a5b;
    --accent-dim: rgba(255, 77, 31, 0.15);
    --success: #5fc97e;
    --display: 'Anton', sans-serif;
    --body: 'Manrope', sans-serif;
    --mono: 'JetBrains Mono', monospace;

    /* Rank Colors */
    --rank-s: #00f2ff;
    --rank-a: #ff0055;
    --rank-b: #ae00ff;
    --rank-c: #00ff88;
    --rank-d: #ffbb00;
    --rank-e: #888888;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255, 77, 31, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(255, 77, 31, 0.04) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .app { max-width: 540px; margin: 0 auto; padding: 0 20px 100px; padding-top: env(safe-area-inset-top); }

  /* HEADER */
  .header {
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .logo { font-family: var(--display); font-size: 38px; letter-spacing: 0.02em; line-height: 0.85; }
  .logo .accent { color: var(--accent); }
  .date {
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; text-align: right;
  }

  /* TABS */
  .tabs {
    display: flex; gap: 4px; margin-top: 16px; padding: 4px;
    background: var(--surface); border-radius: 999px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px 12px; background: transparent; border: none;
    color: var(--text-muted); font-family: var(--body); font-size: 12px;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 999px; cursor: pointer; transition: all 0.25s;
  }
  .tab.active { background: var(--text); color: var(--bg); }

  /* ANALYTICS CARD */
  .analytics-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-top: 16px;
  }

  /* RANK COLOR CLASSES (used for per-exercise letters & weight readouts) */
  .rank-s { color: var(--rank-s); text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
  .rank-a { color: var(--rank-a); text-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
  .rank-b { color: var(--rank-b); text-shadow: 0 0 20px rgba(174, 0, 255, 0.5); }
  .rank-c { color: var(--rank-c); text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
  .rank-d { color: var(--rank-d); text-shadow: 0 0 20px rgba(255, 187, 0, 0.5); }
  .rank-e { color: var(--rank-e); text-shadow: none; }

  /* PR BADGE */
  .pr-badge {
    font-family: var(--display); background: var(--accent); color: white;
    padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px;
    animation: rankGlow 2s infinite alternate;
  }
  @keyframes rankGlow {
    from { box-shadow: 0 0 5px var(--accent); }
    to { box-shadow: 0 0 15px var(--accent); }
  }

  /* TIMER CARD */
  .timer-card {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; position: relative; overflow: hidden;
  }
  .timer-card.running {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 32px rgba(255, 77, 31, 0.12);
  }
  .timer-card.running::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; background: var(--accent); animation: pulse 1.5s ease-in-out infinite;
  }
  .timer-card.paused {
    border-color: var(--rank-d);
    box-shadow: 0 0 0 1px var(--rank-d);
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .timer-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
  }
  .timer-display {
    font-family: var(--mono); font-size: 48px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text); line-height: 1;
  }
  .timer-display.running { color: var(--accent); }
  .timer-display.paused { color: var(--rank-d); }
  .timer-actions { display: flex; gap: 8px; margin-top: 16px; }

  /* BODY SILHOUETTE */
  .body-section {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; display: flex; gap: 16px; align-items: flex-start;
    position: relative; overflow: hidden;
  }
  .body-section::before {
    content: ''; position: absolute; top: 0; left: 0; width: 160px; height: 100%;
    background-image:
      linear-gradient(rgba(255,77,31,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,77,31,0.04) 1px, transparent 1px);
    background-size: 20px 20px;
    mask-image: radial-gradient(ellipse 80px 200px at 65px 50%, black 30%, transparent 70%);
    pointer-events: none;
  }
  .body-figure { width: 130px; flex-shrink: 0; display: flex; justify-content: center; position: relative; z-index: 1; }
  .body-figure svg { width: 100%; height: auto; overflow: visible; display: block; }

  .muscle {
    fill: url(#muscleSheen);
    stroke: #0a0a0a;
    stroke-width: var(--muscle-stroke, 0.6);
    transition: fill 0.6s ease, filter 0.6s ease, stroke-width 0.4s ease;
  }
  .muscle.active {
    fill: url(#activeSheen);
    filter: drop-shadow(0 0 3px rgba(255, 77, 31, 0.7));
  }
  .muscle-line {
    fill: none;
    stroke: #0a0a0a;
    stroke-width: 0.5;
    stroke-linecap: round;
    pointer-events: none;
    opacity: var(--definition-opacity, 0.6);
    transition: opacity 0.4s ease;
  }
  .body-summary { flex: 1; position: relative; z-index: 1; min-width: 0; }
  .body-summary h3 { font-family: var(--display); font-size: 22px; letter-spacing: 0.02em; margin-bottom: 12px; }
  .worked-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .worked-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 4px 10px;
    background: var(--accent-dim); color: var(--accent); border-radius: 999px;
  }

  /* PROFILE INPUTS — sex toggle, age, height, weight */
  .profile-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: stretch; }
  .sex-toggle {
    display: flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .sex-btn {
    background: transparent; border: none; color: var(--text-muted);
    padding: 0 10px; font-family: var(--mono); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .sex-btn.active { background: var(--accent); color: var(--text); }
  .profile-input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 8px; border-radius: 8px;
    font-family: var(--mono); font-size: 11px; text-align: center;
  }
  .profile-input:focus { outline: none; border-color: var(--accent); }

  /* BF SLIDER */
  .bf-slider-row { margin-bottom: 8px; }
  .bf-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 9px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .bf-label strong { color: var(--accent); font-size: 11px; font-weight: 600; }
  .bf-slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: linear-gradient(90deg,
      var(--rank-c) 0%, var(--success) 25%,
      var(--accent) 65%, var(--rank-b) 100%);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .bf-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    background: var(--text); border-radius: 50%; cursor: pointer;
    box-shadow: 0 0 8px rgba(255, 77, 31, 0.6);
  }
  .bf-slider::-moz-range-thumb {
    width: 14px; height: 14px; background: var(--text);
    border-radius: 50%; cursor: pointer; border: none;
    box-shadow: 0 0 8px rgba(255, 77, 31, 0.6);
  }

  .bmi-readout {
    font-family: var(--mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px;
  }
  .bmi-readout strong { color: var(--text); font-weight: 600; }

  /* FORM & LISTS */
  .section { margin-top: 32px; }
  .section-title {
    font-family: var(--display); font-size: 24px; letter-spacing: 0.02em;
    margin-bottom: 12px; display: flex; align-items: baseline; justify-content: space-between;
  }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field label { font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-family: var(--body);
  }

  .btn { background: var(--text); color: var(--bg); border: none; padding: 14px 20px; border-radius: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; }
  .btn-accent { background: var(--accent); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .hidden { display: none !important; }

  /* HISTORY LIST */
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .history-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .history-date { font-family: var(--display); font-size: 18px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-weight: 600; transition: transform 0.3s; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  #muscleChart { max-height: 250px; margin-top: 15px; }

  /* HUNTER RANK CARD (composite RP) */
  .rank-card {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    position: relative;
    overflow: hidden;
  }
  .rank-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 25% 50%, var(--rank-glow, rgba(136,136,136,0.2)) 0%, transparent 60%);
    pointer-events: none;
  }
  .rank-card-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .rank-card-title {
    font-family: var(--mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.15em;
  }
  .rank-card-rp {
    font-family: var(--display); font-size: 22px; color: var(--text);
    letter-spacing: 0.02em;
  }
  .rank-card-rp .rp-suffix { font-size: 11px; color: var(--text-muted); margin-left: 4px; letter-spacing: 0.08em; }
  .rank-card-body {
    display: flex; gap: 20px; align-items: center;
    position: relative; z-index: 1;
  }
  .rank-letter-big {
    font-family: var(--display);
    font-size: 96px;
    line-height: 0.85;
    flex-shrink: 0;
    width: 90px;
    text-align: center;
    letter-spacing: -0.05em;
  }
  .rank-card-stats { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .rank-stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 11px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 4px;
  }
  .rank-stat-row:last-child { border-bottom: none; }
  .rank-stat-num { color: var(--text); font-weight: 600; font-size: 13px; }
  .rank-stat-label { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .rank-subtitle {
    font-family: var(--mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-top: 14px; text-align: center; position: relative; z-index: 1;
  }
  .rank-progress { margin-top: 14px; position: relative; z-index: 1; }
  .rank-progress-bar {
    height: 4px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 2px; overflow: hidden; margin-bottom: 6px;
  }
  .rank-progress-fill {
    height: 100%;
    background: var(--rank-fill, var(--rank-e));
    box-shadow: 0 0 8px var(--rank-fill, var(--rank-e));
    transition: width 0.6s ease;
  }
  .rank-progress-label {
    font-family: var(--mono); font-size: 9px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    display: flex; justify-content: space-between;
  }
  .rank-progress-label strong { color: var(--text); }

  /* STRETCH CARDS */
  .stretch-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 12px; padding: 14px;
    margin-bottom: 10px;
    display: flex; gap: 14px; align-items: flex-start;
  }
  .stretch-illustration {
    width: 80px; height: 70px; flex-shrink: 0;
    background: var(--surface-2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 4px;
  }
  .stretch-illustration svg { width: 100%; height: 100%; }
  .stretch-content { flex: 1; min-width: 0; }
  .stretch-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px; gap: 8px;
  }
  .stretch-name { font-weight: 700; color: var(--text); font-size: 14px; line-height: 1.2; }
  .stretch-duration {
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    flex-shrink: 0; letter-spacing: 0.04em;
  }
  .stretch-instruction {
    font-size: 12px; color: var(--text-muted);
    line-height: 1.4;
  }
  .stretch-targets {
    margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap;
  }
  .stretch-target-tag {
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 2px 6px;
    background: rgba(255,77,31,0.08); color: var(--text-muted);
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="logo">GYM<span class="accent">LOG</span></div>
    <div class="date" id="todayDate"></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="stretches">Stretches</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <!-- TODAY VIEW -->
  <div id="view-today">
    <div class="timer-card" id="timerCard">
      <div class="timer-label" id="timerLabel">Workout Duration</div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-actions">
        <button class="btn btn-accent" id="timerStart">Start Workout</button>
        <button class="btn btn-ghost hidden" id="timerPause" style="flex:1">Pause</button>
        <button class="btn btn-accent hidden" id="timerResume" style="flex:1">Resume</button>
        <button class="btn btn-ghost hidden" id="timerEnd" style="flex:1">End</button>
      </div>
    </div>

    <div class="body-section">
      <div class="body-figure" id="bodyFigure"></div>
      <div class="body-summary">
        <h3>My Profile</h3>
        <div class="profile-row">
            <div class="sex-toggle">
                <button class="sex-btn active" data-sex="male">M</button>
                <button class="sex-btn" data-sex="female">F</button>
            </div>
            <input type="number" class="profile-input" id="userAge" placeholder="Age">
            <input type="number" class="profile-input" id="userHeight" placeholder="H">
            <input type="number" class="profile-input" id="userWeight" placeholder="W">
        </div>
        <div class="bf-slider-row">
            <div class="bf-label">Body Fat <strong id="bfValue">18%</strong></div>
            <input type="range" min="5" max="35" value="18" id="userBodyFat" class="bf-slider">
        </div>
        <div class="bmi-readout" id="bmiReadout"></div>
        <div id="workedSummary" class="worked-list"></div>
      </div>
    </div>

    <section class="section">
      <h2 class="section-title">Log Exercise</h2>
      <div class="form-card">
        <div class="form-row">
          <div class="field" style="flex: 2">
            <label>Exercise</label>
            <input type="text" id="exName" placeholder="Bench press" oninput="checkPRSuggestion()">
            <div id="prHint" style="font-size: 10px; color: var(--accent); margin-top: 4px; display: none;"></div>
          </div>
          <div class="field">
            <label>Body Part</label>
            <select id="exBodyPart">
              <option value="Chest">Chest</option>
              <option value="Back">Back</option>
              <option value="Shoulders">Shoulders</option>
              <option value="Arms">Arms</option>
              <option value="Legs">Legs</option>
              <option value="Core">Core</option>
              <option value="Full Body">Full Body</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Weight (kg)</label><input type="number" id="exWeight" step="0.5"></div>
          <div class="field"><label>Sets</label><input type="number" id="exSets"></div>
          <div class="field"><label>Reps</label><input type="number" id="exReps"></div>
        </div>
        <button class="btn" id="addExercise">+ Add Exercise</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Logged <span class="meta" id="loggedMeta">0 exercises</span></h2>
      <div class="exercise-list" id="todayList"></div>
    </section>
  </div>

  <!-- STRETCHES VIEW -->
  <div id="view-stretches" class="hidden section">
    <div id="stretchesContent"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" class="hidden">
    <div id="rankCardContainer"></div>
    <div class="analytics-card">
      <h3 style="font-family: var(--display); letter-spacing: 0.05em;">MUSCLE BALANCE</h3>
      <canvas id="muscleChart"></canvas>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
/* ============== STATE & CONSTANTS ============== */
const STORAGE_KEYS = { current: 'gymlog_current', history: 'gymlog_history', profile: 'gymlog_profile' };
let state = { exercises: [], timerStart: null, timerElapsed: 0, timerRunning: false, history: [] };
let profile = { height: 180, weight: 80, sex: 'male', age: 30, bodyFat: 18 };
let chartInstance = null;
let timerInterval = null;

/* ============== STRETCH LIBRARY (with inline SVG illustrations) ==============
   ~30 stretches commonly prescribed in physiotherapy and mobility work.
   Each stretch is tagged with one or more body-part targets so the
   recommendation engine can pick relevant ones for what was just trained. */
const STRETCH_LIBRARY = [
  // ===== CHEST =====
  {
    id: 'doorway-chest', name: 'Doorway Chest Stretch', duration: '45s',
    targets: ['Chest', 'Shoulders'],
    instructions: 'Stand in a doorway, place forearms on the frame at 90°, step one foot forward and lean gently until you feel a stretch across the chest.',
    illustration: `<svg viewBox="0 0 120 90"><line x1="35" y1="8" x2="35" y2="85" stroke="#444" stroke-width="2"/><line x1="85" y1="8" x2="85" y2="85" stroke="#444" stroke-width="2"/><circle cx="60" cy="22" r="5" fill="none" stroke="#888" stroke-width="1.5"/><line x1="60" y1="27" x2="60" y2="55" stroke="#888" stroke-width="1.5"/><path d="M 60 35 Q 50 30 38 28" fill="none" stroke="#ff4d1f" stroke-width="2.2" stroke-linecap="round"/><path d="M 60 35 Q 70 30 82 28" fill="none" stroke="#ff4d1f" stroke-width="2.2" stroke-linecap="round"/><line x1="60" y1="55" x2="52" y2="80" stroke="#888" stroke-width="1.5"/><line x1="60" y1="55" x2="68" y2="80" stroke="#888" stroke-width="1.5"/></svg>`
  },
  {
    id: 'pec-floor', name: 'Pec Minor Floor Stretch', duration: '30s/side',

/* ============== PER-EXERCISE RANK (weight-based, kept from your version) ============== */
function getRank(weight) {
  if (weight >= 120) return 'S';
  if (weight >= 80) return 'A';
  if (weight >= 60) return 'B';
  if (weight >= 40) return 'C';
  if (weight >= 20) return 'D';
  return 'E';
}

/* ============== HUNTER RANK SYSTEM (composite RP) ==============
   Composite RP score across all logged history:
     RP = workouts × 10
        + (volume_kg / 1000) × 2     // 2 points per ton lifted
        + total_PRs × 25
        + unique_body_parts × 5

   Tuned so a brand-new user sits in E-rank and a long-term consistent
   lifter eventually reaches S. Rewards consistency, strength milestones,
   and balanced training rather than just a single heavy lift. */
const RANK_THRESHOLDS = [
  { rank: 'E', min: 0,    next: 50,   colorVar: '--rank-e', glow: 'rgba(136,136,136,0.25)' },
  { rank: 'D', min: 50,   next: 150,  colorVar: '--rank-d', glow: 'rgba(255,187,0,0.35)' },
  { rank: 'C', min: 150,  next: 400,  colorVar: '--rank-c', glow: 'rgba(0,255,136,0.35)' },
  { rank: 'B', min: 400,  next: 900,  colorVar: '--rank-b', glow: 'rgba(174,0,255,0.4)' },
  { rank: 'A', min: 900,  next: 1800, colorVar: '--rank-a', glow: 'rgba(255,0,85,0.45)' },
  { rank: 'S', min: 1800, next: null, colorVar: '--rank-s', glow: 'rgba(0,242,255,0.5)' }
];

const RANK_DESCRIPTIONS = {
  'S': 'National Level Hunter',
  'A': 'Elite Raid Leader',
  'B': 'High-Rank Striker',
  'C': 'Solid Tanker',
  'D': 'Active Hunter',
  'E': 'E-Class Awakened'
};

function calculateHunterStats() {
  let workouts = state.history.length;
  let totalVolume = 0;
  let totalPRs = 0;
  const bodyPartsHit = new Set();

  state.history.forEach(session => {
    session.exercises.forEach(ex => {
      const vol = (ex.weight || 0) * (ex.sets || 1) * (ex.reps || 1);
      totalVolume += vol;
      if (ex.isPR) totalPRs += 1;
      if (ex.bodyPart) bodyPartsHit.add(ex.bodyPart);
    });
  });

  const rp = Math.round(
    workouts * 10
    + (totalVolume / 1000) * 2
    + totalPRs * 25
    + bodyPartsHit.size * 5
  );

  let rankInfo = RANK_THRESHOLDS[0];
  for (const tier of RANK_THRESHOLDS) {
    if (rp >= tier.min) rankInfo = tier;
  }

  let progress = 100;
  let rpToNext = 0;
  if (rankInfo.next !== null) {
    progress = ((rp - rankInfo.min) / (rankInfo.next - rankInfo.min)) * 100;
    rpToNext = rankInfo.next - rp;
  }
  const nextIdx = RANK_THRESHOLDS.findIndex(r => r.rank === rankInfo.rank) + 1;
  const nextRank = nextIdx < RANK_THRESHOLDS.length ? RANK_THRESHOLDS[nextIdx].rank : null;

  return {
    rp, workouts, totalVolume, totalPRs,
    bodyPartsCount: bodyPartsHit.size,
    rank: rankInfo.rank,
    colorVar: rankInfo.colorVar,
    glow: rankInfo.glow,
    progress: Math.max(0, Math.min(100, progress)),
    rpToNext, nextRank
  };
}

  }

  container.innerHTML = `
    <div class="rank-card" style="--rank-glow:${stats.glow}; --rank-fill:var(${stats.colorVar});">
      <div class="rank-card-header">
        <div class="rank-card-title">Hunter Rank</div>
        <div class="rank-card-rp">${stats.rp.toLocaleString()}<span class="rp-suffix">RP</span></div>
      </div>
      <div class="rank-card-body">
        <div class="rank-letter-big rank-${stats.rank.toLowerCase()}">${stats.rank}</div>
        <div class="rank-card-stats">
          <div class="rank-stat-row">
            <span class="rank-stat-label">Workouts</span>
            <span class="rank-stat-num">${stats.workouts}</span>
          </div>
          <div class="rank-stat-row">
            <span class="rank-stat-label">Personal Records</span>
            <span class="rank-stat-num">${stats.totalPRs}</span>
          </div>
          <div class="rank-stat-row">
            <span class="rank-stat-label">Volume Lifted</span>
            <span class="rank-stat-num">${volumeTons}t</span>
          </div>
          <div class="rank-stat-row">
            <span class="rank-stat-label">Zones Trained</span>
            <span class="rank-stat-num">${stats.bodyPartsCount}/6</span>
          </div>
        </div>
      </div>
      <div class="rank-subtitle">${RANK_DESCRIPTIONS[stats.rank]}</div>
      ${progressHTML}
    </div>
  `;
}

/* ============== PR & ANALYTICS ============== */
function getPRForExercise(name) {
  let maxWeight = 0;
  state.history.forEach(session => {
    session.exercises.forEach(ex => {
      if (ex.name.toLowerCase() === name.toLowerCase()) {
        maxWeight = Math.max(maxWeight, ex.weight || 0);
      }
    });
  });
  return maxWeight;
}

function checkPRSuggestion() {
  const name = document.getElementById('exName').value.trim();
  const hint = document.getElementById('prHint');
  if (name.length < 3) { hint.style.display = 'none'; return; }
  const pr = getPRForExercise(name);
  if (pr > 0) {
    hint.textContent = `Current Max: ${pr}kg. Level up to ${pr + 2.5}kg?`;
    hint.style.display = 'block';
  } else { hint.style.display = 'none'; }
}

function renderMuscleChart() {
  const ctx = document.getElementById('muscleChart').getContext('2d');
  const counts = { Chest: 0, Back: 0, Shoulders: 0, Arms: 0, Legs: 0, Core: 0 };
  state.history.forEach(s => {
    s.exercises.forEach(e => {
      if (counts[e.bodyPart] !== undefined) counts[e.bodyPart] += (e.weight * (e.sets || 1) * (e.reps || 1));
    });
  });
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: Object.keys(counts),
      datasets: [{
        label: 'Volume Distribution',
        data: Object.values(counts),
        backgroundColor: 'rgba(255, 77, 31, 0.2)',
        borderColor: '#ff4d1f',
        pointBackgroundColor: '#ff4d1f'
      }]
    },
    options: {
      scales: { r: { grid: { color: '#262626' }, angleLines: { color: '#262626' }, ticks: { display: false } } },
      plugins: { legend: { display: false } }
    }
  });
}

/* ============== AVATAR PROPORTION SCALING (sex / age / BMI / body fat) ============== */
function updateAvatarProportions() {
    const h = parseFloat(document.getElementById('userHeight').value) || 180;
    const w = parseFloat(document.getElementById('userWeight').value) || 80;
    const age = parseFloat(document.getElementById('userAge').value) || 30;
    const bf = parseFloat(document.getElementById('userBodyFat').value) || 18;

    profile = { ...profile, height: h, weight: w, age, bodyFat: bf };
    localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify(profile));

    document.getElementById('bfValue').textContent = `${bf}%`;

    const fig = document.getElementById('bodyFigure');
    if (!fig) return;

    // BMI-based width (clamped, square-root softened to avoid cartoonish extremes)
    const refBMI = 80 / Math.pow(1.80, 2);
    const userBMI = w / Math.pow(h / 100, 2);
    const hScale = Math.max(0.88, Math.min(1.12, h / 180));
    const bmiRatio = userBMI / refBMI;

    // Body fat above ~18% baseline adds extra width fullness
    const bfWidthBonus = 1 + Math.max(0, bf - 18) * 0.008;
    const wScale = Math.max(0.85, Math.min(1.30, Math.pow(bmiRatio, 0.55) * bfWidthBonus));

    // Higher body fat → muscle separation lines fade, strokes thin
    const defOpacity = Math.max(0.05, 1 - Math.max(0, bf - 8) * 0.04);
    const muscleStroke = Math.max(0.15, 0.7 - Math.max(0, bf - 8) * 0.025);

    fig.style.setProperty('--definition-opacity', defOpacity.toFixed(2));
    fig.style.setProperty('--muscle-stroke', muscleStroke.toFixed(2));

    const scaler = fig.querySelector('#bodyScaler');
    if (scaler) scaler.setAttribute('transform', `scale(${wScale.toFixed(3)}, ${hScale.toFixed(3)})`);

    // Readout includes age now
    const readout = document.getElementById('bmiReadout');
    if (readout) {
      let category = 'Normal';
      if (userBMI < 18.5) category = 'Underweight';
      else if (userBMI >= 25 && userBMI < 30) category = 'Overweight';
      else if (userBMI >= 30) category = 'Obese';
      readout.innerHTML = `${age} yo · BMI <strong>${userBMI.toFixed(1)}</strong> · ${category}`;
    }
}

/* ============== STATE PERSISTENCE ============== */
function saveState() {
  localStorage.setItem(STORAGE_KEYS.current, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
}

function loadState() {
  const cur = localStorage.getItem(STORAGE_KEYS.current);
  if (cur) Object.assign(state, JSON.parse(cur));
  const hist = localStorage.getItem(STORAGE_KEYS.history);
  if (hist) state.history = JSON.parse(hist);
  const prof = localStorage.getItem(STORAGE_KEYS.profile);
  if (prof) {
      const stored = JSON.parse(prof);
      profile = { ...profile, ...stored };
      document.getElementById('userHeight').value = profile.height;
      document.getElementById('userWeight').value = profile.weight;
      document.getElementById('userAge').value = profile.age;
      document.getElementById('userBodyFat').value = profile.bodyFat;
      document.getElementById('bfValue').textContent = `${profile.bodyFat}%`;
      document.querySelectorAll('.sex-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.sex === profile.sex);
      });
  }
}

/* ============== EXERCISE LOGIC ============== */
function addExercise() {
  const name = document.getElementById('exName').value.trim();
  const weight = parseFloat(document.getElementById('exWeight').value);
  if (!name) return;

  const currentPR = getPRForExercise(name);
  const isPR = weight > currentPR && currentPR > 0;

  state.exercises.push({
    id: Date.now(),
    name,
    bodyPart: document.getElementById('exBodyPart').value,
    weight,
    sets: parseInt(document.getElementById('exSets').value),
    reps: parseInt(document.getElementById('exReps').value),
    isPR: isPR,
    rank: getRank(weight)
  });

  if (isPR) toast("🚨 RANK UP! NEW PR 🚨");
  else toast("Logged");

  if (!state.timerRunning && state.timerElapsed === 0) startTimer();
  document.getElementById('exName').value = '';
  saveState();
  renderAll();
}

function endWorkout() {
  if (state.exercises.length === 0) return;
  if (!confirm('Save workout to history?')) return;

  const finalElapsed = state.timerElapsed + (state.timerRunning ? Date.now() - state.timerStart : 0);

  const session = {
    id: Date.now(),
    date: new Date().toISOString(),
    duration: finalElapsed,
    exercises: [...state.exercises]
  };

  state.history.unshift(session);
  state.exercises = [];
  state.timerRunning = false;
  state.timerElapsed = 0;
  state.timerStart = null;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('timerDisplay').textContent = '00:00:00';
  saveState();
  renderAll();
}

/* ============== TIMER (proper pause/resume) ============== */
function startTimer() {
  if (state.timerRunning) return;
  state.timerStart = Date.now();
  state.timerRunning = true;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  saveState();
  renderTimerUI();
}

function pauseTimer() {
  if (!state.timerRunning) return;
  state.timerElapsed += Date.now() - state.timerStart;
  state.timerRunning = false;
  state.timerStart = null;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  saveState();
  renderTimerUI();
  updateTimer();
}

function resumeTimer() {
  if (state.timerRunning) return;
  state.timerStart = Date.now();
  state.timerRunning = true;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  saveState();
  renderTimerUI();
}

function updateTimer() {
  const ms = state.timerElapsed + (state.timerRunning ? Date.now() - state.timerStart : 0);
  document.getElementById('timerDisplay').textContent = new Date(ms).toISOString().substr(11, 8);
}

function renderTimerUI() {
  const card = document.getElementById('timerCard');
  const display = document.getElementById('timerDisplay');
  const startBtn = document.getElementById('timerStart');
  const pauseBtn = document.getElementById('timerPause');
  const resumeBtn = document.getElementById('timerResume');
  const endBtn = document.getElementById('timerEnd');

  card.classList.remove('running', 'paused');
  display.classList.remove('running', 'paused');

  if (state.timerRunning) {
    card.classList.add('running');
    display.classList.add('running');
    startBtn.classList.add('hidden');
    pauseBtn.classList.remove('hidden');
    resumeBtn.classList.add('hidden');
    endBtn.classList.remove('hidden');
  } else if (state.timerElapsed > 0) {
    card.classList.add('paused');
    display.classList.add('paused');
    startBtn.classList.add('hidden');
    pauseBtn.classList.add('hidden');
    resumeBtn.classList.remove('hidden');
    endBtn.classList.remove('hidden');
  } else {
    startBtn.classList.remove('hidden');
    pauseBtn.classList.add('hidden');
    resumeBtn.classList.add('hidden');
    endBtn.classList.add('hidden');
  }
}

/* ============== UI RENDERING ============== */
function renderTodayList() {
  const list = document.getElementById('todayList');
  document.getElementById('loggedMeta').textContent = `${state.exercises.length} items`;
  list.innerHTML = state.exercises.slice().reverse().map(ex => `
    <div class="exercise-item" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
      <div style="flex:1">
        <div class="exercise-name" style="font-weight: 700; color: var(--text);">${ex.name} ${ex.isPR ? '<span class="pr-badge">PR</span>' : ''}</div>
        <div class="exercise-meta" style="font-size: 12px; color: var(--text-muted);">${ex.bodyPart} · ${ex.weight}kg · ${ex.sets}x${ex.reps}</div>
      </div>
      <div class="rank-${ex.rank.toLowerCase()}" style="font-family: var(--display); font-size: 24px;">${ex.rank}</div>
    </div>
  `).join('');
}

/* ============== STRETCH RECOMMENDATION ENGINE ============== */
function getRecommendedStretches(workedParts) {
  if (workedParts.length === 0) {
    return STRETCH_LIBRARY.filter(s => s.targets.includes('Full Body')).slice(0, 5);
  }

  // Score every stretch by how many of the worked parts it hits
  const scored = STRETCH_LIBRARY.map(s => ({
    stretch: s,
    score: s.targets.filter(t => workedParts.includes(t)).length
  })).filter(x => x.score > 0);

  scored.sort((a, b) => b.score - a.score);
  let recommended = scored.map(x => x.stretch);

  // Top up with full-body stretches if fewer than 5
  if (recommended.length < 5) {
    const fillers = STRETCH_LIBRARY.filter(s =>
      s.targets.includes('Full Body') && !recommended.includes(s)
    );
    recommended = [...recommended, ...fillers].slice(0, Math.max(5, recommended.length));
  }

  return recommended;
}

function renderStretches() {
  const container = document.getElementById('stretchesContent');
  const workedParts = [...new Set(state.exercises.map(ex => ex.bodyPart))];
  const recommended = getRecommendedStretches(workedParts);

  let html = `<h2 class="section-title">Recovery Plan</h2>`;
  if (workedParts.length === 0) {
    html += `<p style="color:var(--text-muted); margin-bottom:15px; font-size:13px;">No workout logged today — here's a full-body mobility flow to keep things loose.</p>`;
  } else {
    html += `<p style="color:var(--accent); font-family:var(--mono); font-size:10px; text-transform:uppercase; margin-bottom:15px; letter-spacing:0.08em;">Targeting: ${workedParts.join(' + ')}</p>`;
  }

  recommended.forEach(s => {
    const tags = s.targets.map(t => `<span class="stretch-target-tag">${t}</span>`).join('');
    html += `
      <div class="stretch-card">
        <div class="stretch-illustration">${s.illustration}</div>
        <div class="stretch-content">
          <div class="stretch-header">
            <div class="stretch-name">${s.name}</div>
            <div class="stretch-duration">${s.duration}</div>
          </div>
          <div class="stretch-instruction">${s.instructions}</div>
          <div class="stretch-targets">${tags}</div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = state.history.map(s => `
    <div class="history-item">
      <div class="history-header">
        <div class="history-date">${new Date(s.date).toLocaleDateString().toUpperCase()}</div>
        <div style="color: var(--text-muted); font-size: 12px;">${Math.round(s.duration/60000)}m</div>
      </div>
      ${s.exercises.map(e => `<div style="font-size: 13px; display:flex; justify-content:space-between"><span>${e.name}</span><span class="rank-${(e.rank || 'e').toLowerCase()}">${e.weight}kg</span></div>`).join('')}
    </div>
  `).join('');
  renderRankCard();
  renderMuscleChart();
}

function renderBody() {
  const fig = document.getElementById('bodyFigure');
  const svg = profile.sex === 'female' ? BODY_SVG_F : BODY_SVG_M;
  fig.innerHTML = svg;

  const worked = new Set(state.exercises.map(e => e.bodyPart));
  fig.querySelectorAll('.muscle').forEach(m => {
    if (worked.has(m.dataset.zone)) m.classList.add('active');
    if (worked.has("Full Body")) m.classList.add('active');
  });

  document.getElementById('workedSummary').innerHTML = Array.from(worked).map(p =>
    `<span class="worked-tag">${p}</span>`
  ).join('');

  updateAvatarProportions();
}

/* ============== INIT ============== */
function renderAll() { renderTodayList(); renderBody(); renderTimerUI(); }
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.tab;
    document.getElementById('view-today').classList.toggle('hidden', target !== 'today');
    document.getElementById('view-history').classList.toggle('hidden', target !== 'history');
    document.getElementById('view-stretches').classList.toggle('hidden', target !== 'stretches');
    if (target === 'history') renderHistory();
    if (target === 'stretches') renderStretches();
  };
});

// Sex toggle
document.querySelectorAll('.sex-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.sex-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    profile.sex = btn.dataset.sex;
    localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify(profile));
    renderBody();
  };
});

// Profile inputs trigger proportion updates
['userAge', 'userHeight', 'userWeight'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateAvatarProportions);
});
document.getElementById('userBodyFat').addEventListener('input', updateAvatarProportions);

document.getElementById('addExercise').onclick = addExercise;
document.getElementById('timerStart').onclick = startTimer;
document.getElementById('timerPause').onclick = pauseTimer;
document.getElementById('timerResume').onclick = resumeTimer;
document.getElementById('timerEnd').onclick = endWorkout;
document.getElementById('todayDate').textContent = new Date().toDateString().toUpperCase();

loadState();

// Resume timer interval if a workout was running when the page closed
if (state.timerRunning && state.timerStart) {
  timerInterval = setInterval(updateTimer, 1000);
}

renderAll();
</script>
