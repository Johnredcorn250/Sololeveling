<script>

/* ============== NEW: DATE KEY (DAILY RESET) ============== */
function getTodayKey() {
  const d = new Date();
  return d.toISOString().slice(0, 10); // YYYY-MM-DD
}

/* ============== STATE (UPDATED) ============== */
let state = {
  dateKey: getTodayKey(),
  exercises: [],
  timerStart: null,
  timerElapsed: 0,
  timerRunning: false,
  history: []
};

/* ============== STORAGE (UPDATED WITH DAY RESET) ============== */
function loadState() {
  try {
    const current = JSON.parse(localStorage.getItem(STORAGE_KEYS.current) || '{}');

    // RESET if new day
    if (current.dateKey !== getTodayKey()) {
      state.exercises = [];
      state.timerStart = null;
      state.timerElapsed = 0;
      state.timerRunning = false;
      state.dateKey = getTodayKey();
    } else {
      Object.assign(state, current);
    }

    const hist = localStorage.getItem(STORAGE_KEYS.history);
    if (hist) state.history = JSON.parse(hist) || [];

  } catch (e) {
    console.error(e);
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEYS.current, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
}

/* ============== TIMER FIX (REAL RESUME) ============== */
function getElapsedMs() {
  if (state.timerRunning && state.timerStart) {
    return state.timerElapsed + (Date.now() - state.timerStart);
  }
  return state.timerElapsed;
}

/* ============== NEW: EDIT EXERCISE ============== */
function editExercise(id) {
  const ex = state.exercises.find(e => e.id === id);
  if (!ex) return;

  const name = prompt('Edit exercise name', ex.name);
  if (!name) return;

  const weight = prompt('Weight (kg)', ex.weight || '');
  const sets = prompt('Sets', ex.sets || '');
  const reps = prompt('Reps', ex.reps || '');

  ex.name = name;
  ex.weight = weight ? parseFloat(weight) : null;
  ex.sets = sets ? parseInt(sets) : null;
  ex.reps = reps ? parseInt(reps) : null;

  saveState();
  renderTodayList();
  toast('Updated');
}

/* ============== UPDATED LIST (EDIT BUTTON) ============== */
function renderTodayList() {
  const list = document.getElementById('todayList');
  const meta = document.getElementById('loggedMeta');

  meta.textContent = `${state.exercises.length} exercise${state.exercises.length === 1 ? '' : 's'}`;

  if (!state.exercises.length) {
    list.innerHTML = '<div class="empty-state">Nothing logged yet today.</div>';
    return;
  }

  list.innerHTML = state.exercises.slice().reverse().map(ex => {
    const parts = [];
    if (ex.weight) parts.push(`${ex.weight}kg`);
    if (ex.sets && ex.reps) parts.push(`${ex.sets}×${ex.reps}`);

    return `
    <div class="exercise-item">
      <div class="exercise-info">
        <div class="exercise-name">${escapeHtml(ex.name)}</div>
        <div class="exercise-meta">
          <span class="body-part">${ex.bodyPart}</span>
          ${parts.join(' · ')}
        </div>
      </div>
      <button onclick="editExercise(${ex.id})">✎</button>
      <button onclick="deleteExercise(${ex.id})">×</button>
    </div>`;
  }).join('');
}

/* ============== SMART HISTORY (GROUPED + CLEAN) ============== */
function renderHistory() {
  const list = document.getElementById('historyList');

  if (!state.history.length) {
    list.innerHTML = '<div class="empty-state">No workouts yet.</div>';
    return;
  }

  list.innerHTML = state.history.map(s => {
    const date = new Date(s.date);
    const totalVolume = s.exercises.reduce((acc, e) =>
      acc + ((e.weight || 0) * (e.sets || 0) * (e.reps || 0)), 0);

    return `
    <div class="history-item">
      <div class="history-header">
        <div>${date.toDateString()}</div>
        <div>${formatTime(s.duration)}</div>
      </div>

      <div style="margin:8px 0; color: var(--accent)">
        Volume: ${totalVolume.toLocaleString()}kg
      </div>

      ${s.exercises.map(e => `
        <div class="history-exercise">
          <span>${escapeHtml(e.name)}</span>
          <span>${e.sets || ''}×${e.reps || ''}</span>
        </div>
      `).join('')}

    </div>`;
  }).join('');
}

/* ============== NEW: AUTO START TIMER IMPROVEMENT ============== */
function addExercise() {
  const name = document.getElementById('exName').value.trim();
  if (!name) return toast('Enter exercise');

  state.exercises.push({
    id: Date.now(),
    name,
    bodyPart: exBodyPart.value,
    weight: parseFloat(exWeight.value) || null,
    sets: parseInt(exSets.value) || null,
    reps: parseInt(exReps.value) || null
  });

  // 🔥 smarter auto-start
  if (!state.timerRunning && state.timerElapsed === 0) {
    startTimer();
  }

  saveState();
  renderAll();
  toast('Logged');

  exName.value = '';
}

/* ============== INIT (FIX TIMER RESUME) ============== */
function init() {
  loadState();

  // resume timer properly
  if (state.timerRunning && state.timerStart) {
    timerInterval = setInterval(updateTimerDisplay, 1000);
  }

  renderAll();

  // EVENTS...
}

</script>
