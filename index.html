<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYMLOG">
<title>GYMLOG | Solo Leveling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #1c1c1c;
    --border: #262626;
    --text: #f5f1ea;
    --text-muted: #888;
    --text-faint: #555;
    --accent: #ff4d1f;
    --accent-light: #ff8a5b;
    --accent-dim: rgba(255, 77, 31, 0.15);
    --success: #5fc97e;
    --display: 'Anton', sans-serif;
    --body: 'Manrope', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --rank-s: #00f2ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255, 77, 31, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(255, 77, 31, 0.04) 0%, transparent 50%);
    background-attachment: fixed;
  }

  .app { max-width: 540px; margin: 0 auto; padding: 0 20px 100px; padding-top: env(safe-area-inset-top); }

  /* HEADER */
  .header {
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .logo { font-family: var(--display); font-size: 38px; letter-spacing: 0.02em; line-height: 0.85; }
  .logo .accent { color: var(--accent); }
  .date {
    font-family: var(--mono); font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; text-align: right;
  }

  /* TABS */
  .tabs {
    display: flex; gap: 4px; margin-top: 16px; padding: 4px;
    background: var(--surface); border-radius: 999px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px 12px; background: transparent; border: none;
    color: var(--text-muted); font-family: var(--body); font-size: 12px;
    font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 999px; cursor: pointer; transition: all 0.25s;
  }
  .tab.active { background: var(--text); color: var(--bg); }

  /* ANALYTICS CARD */
  .analytics-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-top: 24px;
  }

  /* PR BADGE */
  .pr-badge {
    font-family: var(--display); background: var(--accent); color: white;
    padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 8px;
    animation: rankGlow 2s infinite alternate;
  }
  @keyframes rankGlow {
    from { box-shadow: 0 0 5px var(--accent); }
    to { box-shadow: 0 0 15px var(--accent); }
  }

  /* TIMER CARD */
  .timer-card {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; position: relative; overflow: hidden;
  }
  .timer-card.running {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 8px 32px rgba(255, 77, 31, 0.12);
  }
  .timer-card.running::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 2px; background: var(--accent); animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .timer-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
  }
  .timer-display {
    font-family: var(--mono); font-size: 48px; font-weight: 600;
    letter-spacing: -0.02em; color: var(--text); line-height: 1;
  }
  .timer-display.running { color: var(--accent); }
  .timer-actions { display: flex; gap: 8px; margin-top: 16px; }

  /* BODY SILHOUETTE & PROFILE */
  .body-section {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; display: flex; gap: 20px; align-items: center;
    position: relative; overflow: hidden;
  }
  /* subtle grid backdrop behind avatar — system UI feel */
  .body-section::before {
    content: ''; position: absolute; top: 0; left: 0; width: 170px; height: 100%;
    background-image:
      linear-gradient(rgba(255,77,31,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,77,31,0.04) 1px, transparent 1px);
    background-size: 20px 20px;
    mask-image: radial-gradient(ellipse 80px 200px at 65px 50%, black 30%, transparent 70%);
    pointer-events: none;
  }
  .body-figure { width: 140px; flex-shrink: 0; display: flex; justify-content: center; position: relative; z-index: 1; }
  .body-figure svg { width: 100%; height: auto; overflow: visible; display: block; }

  /* MUSCLE STYLING — gradient depth + glow on activation */
  .muscle {
    fill: url(#muscleSheen);
    stroke: #0a0a0a;
    stroke-width: 0.6;
    transition: fill 0.6s ease, filter 0.6s ease;
  }
  .muscle.active {
    fill: url(#activeSheen);
    filter: drop-shadow(0 0 3px rgba(255, 77, 31, 0.7));
  }
  /* thin separator lines layered on top — non-interactive */
  .muscle-line {
    fill: none;
    stroke: #0a0a0a;
    stroke-width: 0.5;
    stroke-linecap: round;
    pointer-events: none;
    opacity: 0.6;
  }
  .body-summary { flex: 1; position: relative; z-index: 1; }
  .body-summary h3 {
    font-family: var(--display); font-size: 22px;
    letter-spacing: 0.02em; margin-bottom: 8px;
  }
  .worked-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .worked-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 4px 10px;
    background: var(--accent-dim); color: var(--accent); border-radius: 999px;
  }

  /* PHYSICAL STATS INPUTS */
  .stats-inputs { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-field { flex: 1; }
  .stat-field input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 8px;
    font-family: var(--mono); font-size: 11px;
  }
  .stat-field input:focus { outline: none; border-color: var(--accent); }

  /* BMI READOUT */
  .bmi-readout {
    font-family: var(--mono); font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .bmi-readout strong { color: var(--text); font-weight: 600; }

  /* FORM & LISTS */
  .section { margin-top: 32px; }
  .section-title {
    font-family: var(--display); font-size: 24px; letter-spacing: 0.02em;
    margin-bottom: 12px; display: flex; align-items: baseline; justify-content: space-between;
  }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field label { font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; }
  .field input, .field select {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-family: var(--body);
  }

  .btn { background: var(--text); color: var(--bg); border: none; padding: 14px 20px; border-radius: 10px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; }
  .btn-accent { background: var(--accent); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .hidden { display: none !important; }

  /* HISTORY LIST */
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .history-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .history-date { font-family: var(--display); font-size: 18px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-weight: 600; transition: transform 0.3s; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  #muscleChart { max-height: 250px; margin-top: 15px; }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="logo">GYM<span class="accent">LOG</span></div>
    <div class="date" id="todayDate"></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="stretches">Stretches</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="view-today">
    <div class="timer-card" id="timerCard">
      <div class="timer-label" id="timerLabel">Workout Duration</div>
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="timer-actions">
        <button class="btn btn-accent" id="timerStart">Start Workout</button>
        <button class="btn btn-ghost hidden" id="timerPause" style="flex:1">Pause</button>
        <button class="btn btn-ghost hidden" id="timerEnd" style="flex:1">End</button>
      </div>
    </div>

    <div class="body-section">
      <div class="body-figure" id="bodyFigure"></div>
      <div class="body-summary">
        <h3>My Profile</h3>
        <div class="stats-inputs">
            <div class="stat-field">
                <input type="number" id="userHeight" placeholder="H (cm)" oninput="updateAvatarProportions()">
            </div>
            <div class="stat-field">
                <input type="number" id="userWeight" placeholder="W (kg)" oninput="updateAvatarProportions()">
            </div>
        </div>
        <div class="bmi-readout" id="bmiReadout"></div>
        <div id="workedSummary" class="empty">No exercises logged yet.</div>
      </div>
    </div>

    <section class="section">
      <h2 class="section-title">Log Exercise</h2>
      <div class="form-card">
        <div class="form-row">
          <div class="field" style="flex: 2">
            <label>Exercise</label>
            <input type="text" id="exName" placeholder="Bench press" oninput="checkPRSuggestion()">
            <div id="prHint" style="font-size: 10px; color: var(--accent); margin-top: 4px; display: none;"></div>
          </div>
          <div class="field">
            <label>Body Part</label>
            <select id="exBodyPart">
              <option value="Chest">Chest</option>
              <option value="Back">Back</option>
              <option value="Shoulders">Shoulders</option>
              <option value="Arms">Arms</option>
              <option value="Legs">Legs</option>
              <option value="Core">Core</option>
              <option value="Full Body">Full Body</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="field"><label>Weight (kg)</label><input type="number" id="exWeight" step="0.5"></div>
          <div class="field"><label>Sets</label><input type="number" id="exSets"></div>
          <div class="field"><label>Reps</label><input type="number" id="exReps"></div>
        </div>
        <button class="btn" id="addExercise">+ Add Exercise</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Logged <span class="meta" id="loggedMeta">0 exercises</span></h2>
      <div class="exercise-list" id="todayList"></div>
    </section>
  </div>

  <div id="view-stretches" class="hidden section">
    <div id="stretchesContent"></div>
  </div>

  <div id="view-history" class="hidden">
    <div class="analytics-card">
      <h3 style="font-family: var(--display); letter-spacing: 0.05em;">MUSCLE BALANCE</h3>
      <canvas id="muscleChart"></canvas>
    </div>
    <div id="historyList"></div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>

let state = { exercises: [], timerStart: null, timerElapsed: 0, timerRunning: false, history: [] };
let profile = { height: 180, weight: 80 };
let chartInstance = null;

const stretchLibrary = {

    { name: "Sphinx Pose", duration: "1m", instructions: "Prop yourself up on your forearms to gently extend the spine." }
  ],
  "Full Body": [
    { name: "World's Greatest Stretch", duration: "5 reps/side", instructions: "Lunge forward, elbow to instep, then rotate arm to the sky." },
    { name: "Deep Squat Hold", duration: "1m", instructions: "Sit in a deep squat, using elbows to push knees out." }

};

/* ============== UPGRADED ANATOMICAL MANNEQUIN ==============
   Front view, viewBox 200x440. Each muscle group is a separate path
   with a data-zone attribute matching the body-part categories.

const BODY_SVG = `

/* ============== ANALYTICS & PR LOGIC ============== */
function getPRForExercise(name) {
  let maxWeight = 0;
  state.history.forEach(session => {
    session.exercises.forEach(ex => {
      if (ex.name.toLowerCase() === name.toLowerCase()) {
        maxWeight = Math.max(maxWeight, ex.weight || 0);
      }
    });
  });
  return maxWeight;
}

function checkPRSuggestion() {
  const name = document.getElementById('exName').value.trim();
  const hint = document.getElementById('prHint');
  if (name.length < 3) { hint.style.display = 'none'; return; }
  const pr = getPRForExercise(name);
  if (pr > 0) {
    hint.textContent = `Current Max: ${pr}kg. Level up to ${pr + 2.5}kg?`;
    hint.style.display = 'block';
  } else { hint.style.display = 'none'; }
}

function getRank(weight) {
  if (weight >= 120) return 'S';
  if (weight >= 80) return 'A';
  if (weight >= 60) return 'B';
  if (weight >= 40) return 'C';
  if (weight >= 20) return 'D';
  return 'E';
}

function renderMuscleChart() {
  const ctx = document.getElementById('muscleChart').getContext('2d');
  const counts = { Chest: 0, Back: 0, Shoulders: 0, Arms: 0, Legs: 0, Core: 0 };

  state.history.forEach(s => {
    s.exercises.forEach(e => {
      if (counts[e.bodyPart] !== undefined) counts[e.bodyPart] += (e.weight * (e.sets || 1) * (e.reps || 1));
    });
  });

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: Object.keys(counts),
      datasets: [{
        label: 'Volume Distribution',
        data: Object.values(counts),
        backgroundColor: 'rgba(255, 77, 31, 0.2)',
        borderColor: '#ff4d1f',
        pointBackgroundColor: '#ff4d1f'
      }]
    },
    options: {
      scales: { r: { grid: { color: '#262626' }, angleLines: { color: '#262626' }, ticks: { display: false } } },
      plugins: { legend: { display: false } }
    }
  });
}

/* ============== SMARTER BODY PROPORTION SCALING ==============
   Old logic scaled width linearly with weight (60kg → 0.75x, 120kg → 1.5x — too extreme).
   New logic: height scales vertically (clamped); width is driven by BMI ratio with a
   square-root softener so changes feel natural rather than cartoonish. */
function updateAvatarProportions() {
    const h = parseFloat(document.getElementById('userHeight').value) || 180;
    const w = parseFloat(document.getElementById('userWeight').value) || 80;
    profile = { height: h, weight: w };
    localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify(profile));

    const scaler = document.getElementById('bodyScaler');
    if (!scaler) return;

    // Reference body: 180cm / 80kg → BMI 24.7
    const refBMI = 80 / Math.pow(1.80, 2);
    const userBMI = w / Math.pow(h / 100, 2);

    // Vertical scale: gentle, clamped so figure never breaks the card
    const hScale = Math.max(0.88, Math.min(1.12, h / 180));

    // Horizontal scale: BMI-driven, square-root softens extremes
    const bmiRatio = userBMI / refBMI;
    const wScale = Math.max(0.85, Math.min(1.25, Math.pow(bmiRatio, 0.55)));

    scaler.setAttribute('transform', `scale(${wScale.toFixed(3)}, ${hScale.toFixed(3)})`);

    // BMI readout for the user
    const readout = document.getElementById('bmiReadout');
    if (readout) {
      let category = 'Normal';
      if (userBMI < 18.5) category = 'Underweight';
      else if (userBMI >= 25 && userBMI < 30) category = 'Overweight';
      else if (userBMI >= 30) category = 'Obese';
      readout.innerHTML = `BMI <strong>${userBMI.toFixed(1)}</strong> · ${category}`;
    }
}

/* ============== CORE LOGIC ============== */
function saveState() {
  localStorage.setItem(STORAGE_KEYS.current, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
}

function loadState() {
  const cur = localStorage.getItem(STORAGE_KEYS.current);
  if (cur) Object.assign(state, JSON.parse(cur));
  const hist = localStorage.getItem(STORAGE_KEYS.history);
  if (hist) state.history = JSON.parse(hist);
  const prof = localStorage.getItem(STORAGE_KEYS.profile);
  if (prof) {
      profile = JSON.parse(prof);
      document.getElementById('userHeight').value = profile.height;
      document.getElementById('userWeight').value = profile.weight;
  }
}

function addExercise() {
  const name = document.getElementById('exName').value.trim();
  const weight = parseFloat(document.getElementById('exWeight').value);
  if (!name) return;

  const currentPR = getPRForExercise(name);
  const isPR = weight > currentPR && currentPR > 0;

  state.exercises.push({
    id: Date.now(),
    name,
    bodyPart: document.getElementById('exBodyPart').value,
    weight,
    sets: parseInt(document.getElementById('exSets').value),
    reps: parseInt(document.getElementById('exReps').value),
    isPR: isPR,
    rank: getRank(weight)
  });

  if (isPR) toast("🚨 RANK UP! NEW PR 🚨");
  else toast("Logged");

  if (!state.timerRunning && state.timerElapsed === 0) startTimer();
  document.getElementById('exName').value = '';
  saveState();
  renderAll();
}

function endWorkout() {
  if (state.exercises.length === 0) return;
  if (!confirm('Save workout to history?')) return;

  const session = {
    id: Date.now(),
    date: new Date().toISOString(),
    duration: state.timerElapsed + (state.timerRunning ? Date.now() - state.timerStart : 0),
    exercises: [...state.exercises]
  };

  state.history.unshift(session);
  state.exercises = [];
  state.timerRunning = false;
  state.timerElapsed = 0;
  saveState();
  renderAll();
}

/* ============== UI RENDERING ============== */
function renderTodayList() {
  const list = document.getElementById('todayList');
  document.getElementById('loggedMeta').textContent = `${state.exercises.length} items`;
  list.innerHTML = state.exercises.slice().reverse().map(ex => `
    <div class="exercise-item" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
      <div style="flex:1">
        <div class="exercise-name" style="font-weight: 700; color: var(--text);">${ex.name} ${ex.isPR ? '<span class="pr-badge">PR</span>' : ''}</div>
        <div class="exercise-meta" style="font-size: 12px; color: var(--text-muted);">${ex.bodyPart} · ${ex.weight}kg · ${ex.sets}x${ex.reps}</div>
      </div>
      <div style="font-family: var(--display); color: var(--accent); font-size: 20px;">${ex.rank}</div>
    </div>
  `).join('');
}

function renderStretches() {
  const container = document.getElementById('stretchesContent');
  const workedParts = [...new Set(state.exercises.map(ex => ex.bodyPart))];

  let html = `<h2 class="section-title">Recovery Plan</h2>`;

  if (workedParts.length === 0) {
    html += `<p style="color:var(--text-muted); margin-bottom:15px;">Pick a stretching routine. Always gotta stretch gang</p>`;
    workedParts.push("Full Body");
  } else {
    html += `<p style="color:var(--accent); font-family:var(--mono); font-size:10px; text-transform:uppercase; margin-bottom:15px;">Targeting: ${workedParts.join(' + ')}</p>`;
  }

  workedParts.forEach(part => {
    const stretches = stretchLibrary[part] || stretchLibrary["Full Body"];
    stretches.forEach(s => {
      html += `
        <div class="history-item" style="border-left: 2px solid var(--accent); margin-bottom: 12px;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <div style="font-weight:700; color:var(--text);">${s.name}</div>
            <div style="font-family:var(--mono); font-size:11px; color:var(--accent);">${s.duration}</div>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:4px; line-height:1.4;">${s.instructions}</div>
        </div>
      `;
    });
  });

  container.innerHTML = html;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = state.history.map(s => `
    <div class="history-item">
      <div class="history-header">
        <div class="history-date">${new Date(s.date).toLocaleDateString().toUpperCase()}</div>
        <div style="color: var(--text-muted); font-size: 12px;">${Math.round(s.duration/60000)}m</div>
      </div>
      ${s.exercises.map(e => `<div style="font-size: 13px; display:flex; justify-content:space-between"><span>${e.name}</span><span>${e.weight}kg</span></div>`).join('')}
    </div>
  `).join('');
  renderMuscleChart();
}

function renderBody() {
  const fig = document.getElementById('bodyFigure');
  fig.innerHTML = BODY_SVG;
  const worked = new Set(state.exercises.map(e => e.bodyPart));
  fig.querySelectorAll('.muscle').forEach(m => {
    if (worked.has(m.dataset.zone)) m.classList.add('active');
    if (worked.has("Full Body")) m.classList.add('active');
  });
  document.getElementById('workedSummary').innerHTML = Array.from(worked).map(p => `<span class="worked-tag">${p}</span>`).join(' ');
  updateAvatarProportions();
}

/* ============== TIMER UTILS ============== */
function startTimer() { state.timerStart = Date.now(); state.timerRunning = true; setInterval(updateTimer, 1000); renderTimerUI(); }
function updateTimer() { if (!state.timerRunning) return; const ms = state.timerElapsed + (Date.now() - state.timerStart); document.getElementById('timerDisplay').textContent = new Date(ms).toISOString().substr(11, 8); }
function renderTimerUI() {
  const isRun = state.timerRunning;
  document.getElementById('timerStart').classList.toggle('hidden', isRun || state.timerElapsed > 0);
  document.getElementById('timerPause').classList.toggle('hidden', !isRun);
  document.getElementById('timerEnd').classList.toggle('hidden', !isRun && state.timerElapsed === 0);
}

/* ============== INIT ============== */
function renderAll() { renderTodayList(); renderBody(); renderTimerUI(); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.tab;
    document.getElementById('view-today').classList.toggle('hidden', target !== 'today');
    document.getElementById('view-history').classList.toggle('hidden', target !== 'history');
    document.getElementById('view-stretches').classList.toggle('hidden', target !== 'stretches');
    if (target === 'history') renderHistory();
    if (target === 'stretches') renderStretches();
  };
});

document.getElementById('addExercise').onclick = addExercise;
document.getElementById('timerStart').onclick = startTimer;
document.getElementById('timerEnd').onclick = endWorkout;
document.getElementById('todayDate').textContent = new Date().toDateString().toUpperCase();

loadState();
renderAll();
</script>
</body>
</html>
