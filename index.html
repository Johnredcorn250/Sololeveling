<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GYMLOG | Solo Leveling</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface-2: #1c1c1c; --border: #262626;
    --text: #f5f1ea; --text-muted: #888; --accent: #ff4d1f; --accent-dim: rgba(255, 77, 31, 0.15);
    --display: 'Anton', sans-serif; --body: 'Manrope', sans-serif; --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; padding: 20px; background-attachment: fixed; background-image: radial-gradient(circle at 20% 0%, rgba(255, 77, 31, 0.08) 0%, transparent 40%); }
  .app { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }

  /* HEADER */
  .header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--display); font-size: 32px; letter-spacing: 1px; }
  .logo span { color: var(--accent); }

  /* TABS */
  .tabs { display: flex; gap: 5px; margin: 20px 0; background: var(--surface); padding: 5px; border-radius: 50px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; border: none; background: none; color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 11px; border-radius: 50px; cursor: pointer; }
  .tab.active { background: var(--text); color: var(--bg); }

  /* AVATAR SYSTEM */
  .body-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; gap: 20px; align-items: center; margin-top: 20px; }
  .body-figure { width: 120px; display: flex; justify-content: center; overflow: visible; }
  .muscle { fill: #2a2a2a; stroke: #1a1a1a; stroke-width: 0.5; transition: all 0.5s ease; }
  .muscle.active { fill: var(--accent); filter: drop-shadow(0 0 5px var(--accent)); }
  
  /* STATS FORM */
  .stats-row { display: flex; gap: 10px; margin-top: 15px; }
  .stat-input { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px; width: 100%; font-family: var(--mono); font-size: 12px; }

  /* CARDS */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; }
  .field label { display: block; font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
  input, select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
  .btn-accent { background: var(--accent); color: white; }
  
  .exercise-item { background: var(--surface-2); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; border-left: 3px solid var(--border); }
  .pr-badge { background: var(--accent); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-family: var(--display); }
  .rank-text { color: var(--accent); font-family: var(--display); font-size: 24px; }

  .hidden { display: none; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 50px; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 999; }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">GYM<span>LOG</span></div>
    <div id="todayDate" style="font-family: var(--mono); font-size: 10px; color: var(--text-muted);"></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="history">History</button>
  </div>

  <div id="view-today">
    <!-- PERSONALIZED AVATAR -->
    <div class="body-section">
      <div class="body-figure" id="bodyContainer">
        <!-- SVG injected by JS -->
      </div>
      <div style="flex:1">
        <h3 style="font-family: var(--display); font-size: 20px;">PLAYER PROPORTIONS</h3>
        <div class="stats-row">
          <div class="field">
            <label>Height (cm)</label>
            <input type="number" id="userHeight" class="stat-input" placeholder="180" oninput="updateAvatarProportions()">
          </div>
          <div class="field">
            <label>Weight (kg)</label>
            <input type="number" id="userWeight" class="stat-input" placeholder="80" oninput="updateAvatarProportions()">
          </div>
        </div>
        <div id="workedSummary" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>Exercise Name</label>
        <input type="text" id="exName" placeholder="Squats..." oninput="checkPRSuggestion()">
        <p id="prHint" style="font-size: 10px; color: var(--accent); margin-bottom: 10px; display: none;"></p>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="field" style="flex:1">
          <label>Weight (kg)</label>
          <input type="number" id="exWeight">
        </div>
        <div class="field" style="flex:1">
          <label>Target Part</label>
          <select id="exBodyPart">
            <option value="Chest">Chest</option>
            <option value="Back">Back</option>
            <option value="Shoulders">Shoulders</option>
            <option value="Arms">Arms</option>
            <option value="Legs">Legs</option>
            <option value="Core">Core</option>
          </select>
        </div>
      </div>
      <button class="btn btn-accent" onclick="addExercise()">+ Log Activity</button>
    </div>

    <div id="todayList" style="margin-top: 20px;"></div>
    <button class="btn" style="margin-top: 10px; background: var(--surface); color: var(--text);" onclick="endWorkout()">Finish Session</button>
  </div>

  <div id="view-history" class="hidden">
    <div class="card"><canvas id="muscleChart"></canvas></div>
    <div id="historyList"></div>
  </div>
</div>

<div id="toast">SAVED</div>

<script>
let state = { exercises: [], history: [], userHeight: 175, userWeight: 75 };
const SVG_TEMPLATE = `
<svg id="avatarSvg" viewBox="0 0 200 400" width="100%" height="100%">
  <g id="bodyScaler" transform-origin="center bottom">
    <circle cx="100" cy="40" r="18" class="muscle" /> <!-- Head -->
    <path d="M 60 80 Q 100 70 140 80 L 145 100 Q 100 90 55 100 Z" class="muscle" data-zone="Shoulders" id="path-shoulders"/>
    <path d="M 65 100 Q 100 95 135 100 L 132 140 Q 100 145 68 140 Z" class="muscle" data-zone="Chest" id="path-chest"/>
    <path d="M 75 140 Q 100 145 125 140 L 122 210 Q 100 215 78 210 Z" class="muscle" data-zone="Core" id="path-core"/>
    <path d="M 55 100 L 40 170 L 55 175 Z" class="muscle" data-zone="Arms" id="path-larm"/>
    <path d="M 145 100 L 160 170 L 145 175 Z" class="muscle" data-zone="Arms" id="path-rarm"/>
    <path d="M 78 210 L 70 320 L 98 320 L 100 215 Z" class="muscle" data-zone="Legs" id="path-lleg"/>
    <path d="M 122 210 L 130 320 L 102 320 L 100 215 Z" class="muscle" data-zone="Legs" id="path-rleg"/>
  </g>
</svg>`;

function updateAvatarProportions() {
  const h = document.getElementById('userHeight').value || 175;
  const w = document.getElementById('userWeight').value || 75;
  state.userHeight = h; state.userWeight = w;
  save();

  const scaler = document.getElementById('bodyScaler');
  if (!scaler) return;

  // Logic: Base height 175cm = scale 1. Base weight 75kg = scale 1.
  const hScale = h / 175;
  const wScale = w / 75;

  // Apply non-uniform scaling
  scaler.setAttribute('transform', `scale(${wScale.toFixed(2)}, ${hScale.toFixed(2)})`);
}

function addExercise() {
  const name = document.getElementById('exName').value;
  const weight = parseFloat(document.getElementById('exWeight').value) || 0;
  const part = document.getElementById('exBodyPart').value;

  const pr = getPR(name);
  const isPR = weight > pr && pr > 0;

  state.exercises.push({
    name, weight, part, isPR, 
    rank: weight > 100 ? 'S' : weight > 80 ? 'A' : weight > 60 ? 'B' : 'E'
  });

  if (isPR) showToast("RANK UP!");
  renderAll();
  save();
}

function renderAll() {
  const list = document.getElementById('todayList');
  list.innerHTML = state.exercises.slice().reverse().map(ex => `
    <div class="exercise-item">
      <div>
        <div style="font-weight:700">${ex.name} ${ex.isPR ? '<span class="pr-badge">PR</span>' : ''}</div>
        <div style="font-size:11px; color:var(--text-muted)">${ex.part} · ${ex.weight}kg</div>
      </div>
      <div class="rank-text">${ex.rank}</div>
    </div>
  `).join('');

  const summary = document.getElementById('workedSummary');
  const parts = [...new Set(state.exercises.map(e => e.part))];
  summary.innerHTML = parts.map(p => `<span style="background:var(--accent-dim); color:var(--accent); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700">${p.toUpperCase()}</span>`).join('');

  // Update muscles
  document.querySelectorAll('.muscle').forEach(m => {
    m.classList.toggle('active', parts.includes(m.dataset.zone));
  });
}

function getPR(name) {
  let max = 0;
  state.history.forEach(s => s.exercises.forEach(e => {
    if (e.name.toLowerCase() === name.toLowerCase()) max = Math.max(max, e.weight);
  }));
  return max;
}

function checkPRSuggestion() {
  const name = document.getElementById('exName').value;
  const pr = getPR(name);
  const hint = document.getElementById('prHint');
  if (pr > 0) { hint.innerText = `Current PR: ${pr}kg. Aim for ${pr + 2.5}kg?`; hint.style.display = 'block'; }
  else hint.style.display = 'none';
}

function endWorkout() {
  if (state.exercises.length === 0) return;
  state.history.unshift({ date: new Date().toISOString(), exercises: [...state.exercises] });
  state.exercises = [];
  save(); renderAll(); showToast("SESSION COMPLETE");
}

function save() { 
  localStorage.setItem('gymlog_v2', JSON.stringify(state)); 
}

function load() {
  const data = localStorage.getItem('gymlog_v2');
  if (data) state = JSON.parse(data);
  document.getElementById('userHeight').value = state.userHeight;
  document.getElementById('userWeight').value = state.userWeight;
}

function showToast(m) { 
  const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = 1; 
  setTimeout(() => t.style.opacity = 0, 2000); 
}

// Tabs
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('view-today').classList.toggle('hidden', t.dataset.tab !== 'today');
  document.getElementById('view-history').classList.toggle('hidden', t.dataset.tab !== 'history');
});

// Init
document.getElementById('bodyContainer').innerHTML = SVG_TEMPLATE;
document.getElementById('todayDate').innerText = new Date().toDateString().toUpperCase();
load();
renderAll();
updateAvatarProportions();
</script>
</body>
</html>
