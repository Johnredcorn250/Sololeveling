<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMLOG Updated</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; background:#0a0a0a; color:#fff; }
.analytics-card { background:#141414; padding:15px; margin:10px 0; border-radius:10px; }
</style>
</head>
<body>

<h2>GYMLOG</h2>

<div id="view-history">
  <div class="analytics-card" id="rankCard" style="display:flex; justify-content:space-between;">
    <div>
      <div style="font-size:10px; color:#888;">CURRENT RANK</div>
      <div id="userRank" style="font-size:28px;">E</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:10px; color:#888;">WORKOUTS</div>
      <div id="workoutCount" style="font-size:20px;">0</div>
    </div>
  </div>

  <div class="analytics-card">
    <canvas id="muscleChart"></canvas>
  </div>

  <div id="historyList"></div>
</div>

<script>
let state = { history: [] };

function getUserRank() {
  const count = state.history.length;
  if (count >= 80) return 'S';
  if (count >= 40) return 'A';
  if (count >= 20) return 'B';
  if (count >= 10) return 'C';
  if (count >= 5) return 'D';
  return 'E';
}

function renderHistory() {
  const list = document.getElementById('historyList');

  const rank = getUserRank();
  document.getElementById('userRank').textContent = rank;
  document.getElementById('workoutCount').textContent = state.history.length;

  list.innerHTML = state.history.map(s => `
    <div class="analytics-card">
      <div>${new Date(s.date).toLocaleDateString()}</div>
      ${s.exercises.map(e => `<div>${e.name} - ${e.weight}kg</div>`).join('')}
    </div>
  `).join('');
}

renderHistory();
</script>

</body>
</html>
