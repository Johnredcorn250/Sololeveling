<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GYMLOG</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { background:#0a0a0a; color:white; font-family:sans-serif; max-width:500px; margin:auto; }
input, select, button { margin:5px 0; padding:10px; width:100%; }
button { cursor:pointer; }
.hidden { display:none; }
</style>
</head>

<body>

<h2>GYMLOG</h2>
<div id="timerDisplay">00:00:00</div>

<button id="timerStart">Start</button>
<button id="timerPause" class="hidden">Pause</button>
<button id="timerEnd" class="hidden">End</button>

<hr>

<h3>Log Exercise</h3>
<input id="exName" placeholder="Exercise">
<select id="exBodyPart">
<option>Chest</option>
<option>Back</option>
<option>Shoulders</option>
<option>Arms</option>
<option>Legs</option>
<option>Core</option>
</select>
<input id="exWeight" type="number" placeholder="Weight">
<input id="exSets" type="number" placeholder="Sets">
<input id="exReps" type="number" placeholder="Reps">

<button id="addExercise">Add Exercise</button>
<button onclick="clearToday()">Clear Today</button>

<hr>

<h3>Today</h3>
<div id="todayList"></div>

<hr>

<h3>History</h3>
<div id="totalVolume"></div>
<canvas id="muscleChart"></canvas>
<div id="historyList"></div>

<script>
const STORAGE_KEYS = {
  current: 'gymlog_current',
  history: 'gymlog_history'
};

let state = {
  exercises: [],
  history: [],
  timerStart: null,
  timerElapsed: 0,
  timerRunning: false
};

let timerInterval = null;
let lastExercise = null;

/* ================= TIMER ================= */

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);

  state.timerStart = Date.now();
  state.timerRunning = true;

  timerInterval = setInterval(updateTimer, 1000);
  renderTimerUI();
}

function pauseTimer() {
  if (!state.timerRunning) return;

  state.timerElapsed += Date.now() - state.timerStart;
  state.timerRunning = false;

  clearInterval(timerInterval);
  renderTimerUI();
}

function updateTimer() {
  if (!state.timerRunning) return;

  const ms = state.timerElapsed + (Date.now() - state.timerStart);
  document.getElementById('timerDisplay').textContent =
    new Date(ms).toISOString().substr(11, 8);
}

function renderTimerUI() {
  document.getElementById('timerStart').classList.toggle('hidden', state.timerRunning || state.timerElapsed > 0);
  document.getElementById('timerPause').classList.toggle('hidden', !state.timerRunning);
  document.getElementById('timerEnd').classList.toggle('hidden', !state.timerRunning && state.timerElapsed === 0);
}

/* ================= DATA ================= */

function saveState() {
  localStorage.setItem(STORAGE_KEYS.current, JSON.stringify(state));
  localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
}

function loadState() {
  const cur = localStorage.getItem(STORAGE_KEYS.current);
  if (cur) Object.assign(state, JSON.parse(cur));

  const hist = localStorage.getItem(STORAGE_KEYS.history);
  if (hist) state.history = JSON.parse(hist);
}

/* ================= EXERCISE ================= */

function addExercise() {
  const name = document.getElementById('exName').value.trim();
  const weight = parseFloat(document.getElementById('exWeight').value);
  const sets = parseInt(document.getElementById('exSets').value);
  const reps = parseInt(document.getElementById('exReps').value);
  const bodyPart = document.getElementById('exBodyPart').value;

  if (!name || !weight || !sets || !reps) {
    alert("Fill all fields");
    return;
  }

  state.exercises.push({ name, weight, sets, reps, bodyPart });

  lastExercise = { name, bodyPart };

  autofillLastExercise();

  if (!state.timerRunning && state.timerElapsed === 0) startTimer();

  saveState();
  renderAll();
}

function autofillLastExercise() {
  if (!lastExercise) return;

  document.getElementById('exName').value = lastExercise.name;
  document.getElementById('exBodyPart').value = lastExercise.bodyPart;
}

/* ================= CLEAR ================= */

function clearToday() {
  if (!confirm("Clear today's workout?")) return;

  state.exercises = [];
  state.timerRunning = false;
  state.timerElapsed = 0;

  if (timerInterval) clearInterval(timerInterval);

  saveState();
  renderAll();
}

/* ================= HISTORY ================= */

function endWorkout() {
  if (state.exercises.length === 0) return;

  const session = {
    date: new Date().toISOString(),
    duration: state.timerElapsed,
    exercises: [...state.exercises]
  };

  state.history.unshift(session);

  state.exercises = [];
  state.timerRunning = false;
  state.timerElapsed = 0;

  saveState();
  renderAll();
}

function getTotalVolume() {
  let total = 0;

  state.history.forEach(s => {
    s.exercises.forEach(e => {
      total += e.weight * e.sets * e.reps;
    });
  });

  return total;
}

/* ================= RENDER ================= */

function renderToday() {
  document.getElementById('todayList').innerHTML =
    state.exercises.map(e =>
      `<div>${e.name} - ${e.weight}kg (${e.sets}x${e.reps})</div>`
    ).join('');
}

function renderHistory() {
  document.getElementById('historyList').innerHTML =
    state.history.map(s =>
      `<div>${new Date(s.date).toLocaleDateString()} (${Math.round(s.duration/60000)} min)</div>`
    ).join('');

  document.getElementById('totalVolume').textContent =
    "Total Volume: " + getTotalVolume().toLocaleString() + " kg";

  renderChart();
}

/* ================= CHART ================= */

let chart;

function renderChart() {
  const ctx = document.getElementById('muscleChart');

  const counts = { Chest:0, Back:0, Shoulders:0, Arms:0, Legs:0, Core:0 };

  state.history.forEach(s => {
    s.exercises.forEach(e => {
      counts[e.bodyPart] += e.weight * e.sets * e.reps;
    });
  });

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: Object.keys(counts),
      datasets: [{
        data: Object.values(counts)
      }]
    }
  });
}

function renderAll() {
  renderToday();
  renderHistory();
  renderTimerUI();
}

/* ================= INIT ================= */

document.getElementById('addExercise').onclick = addExercise;
document.getElementById('timerStart').onclick = startTimer;
document.getElementById('timerPause').onclick = pauseTimer;
document.getElementById('timerEnd').onclick = endWorkout;

loadState();
renderAll();

</script>

</body>
</html>
