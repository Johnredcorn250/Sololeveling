<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#220901">
<title>GYMLOG | Inferno Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #220901; --surface: #621708; --surface-2: #941B0C;
    --accent: #F6AA1C; --accent-alt: #BC3908;
    --border: rgba(246, 170, 28, 0.15);
    --text: #f5f1ea; --text-muted: #d1b8b0;
    --display: 'Anton', sans-serif; --body: 'Manrope', sans-serif; --mono: 'JetBrains Mono', monospace;
    --rank-s: #F6AA1C; --rank-a: #BC3908; --rank-b: #941B0C; --rank-c: #ffbb00; --rank-d: #888888; --rank-e: #555555;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; padding-bottom: 50px; }
  .app { max-width: 540px; margin: 0 auto; padding: 20px; }
  
  .header { padding: 20px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }
  .logo { font-family: var(--display); font-size: 38px; color: var(--text); letter-spacing: 1px; }
  .logo span { color: var(--accent); text-shadow: 0 0 15px rgba(246, 170, 28, 0.4); }

  .tabs { display: flex; gap: 4px; margin: 20px 0; padding: 4px; background: rgba(0,0,0,0.3); border-radius: 999px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); font-family: var(--body); font-size: 11px; font-weight: 700; text-transform: uppercase; border-radius: 999px; cursor: pointer; transition: 0.2s; }
  .tab.active { background: var(--accent); color: var(--bg); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
  
  /* Restored Mannequin Styles */
  .muscle { fill: #3a1109; stroke: #220901; stroke-width: 0.8; transition: all 0.4s ease; }
  .muscle.active { fill: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); stroke: var(--bg); }

  .btn { background: var(--accent); color: var(--bg); border: none; padding: 15px; border-radius: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn-ghost { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  
  .field { margin-bottom: 15px; }
  .field label { font-family: var(--mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 5px; }
  .field input, .field select { width: 100%; background: var(--bg); border: 1px solid var(--surface-2); color: white; padding: 12px; border-radius: 8px; font-family: var(--body); }

  .rank-display { font-family: var(--display); font-size: 80px; line-height: 1; }
  .rank-s { color: var(--rank-s); text-shadow: 0 0 20px var(--accent); }
  .history-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--accent-alt); }
  .worked-tag { font-family: var(--mono); font-size: 10px; background: rgba(246, 170, 28, 0.1); color: var(--accent); padding: 4px 8px; border-radius: 4px; margin-right: 5px; margin-top: 5px; display: inline-block; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">GYM<span>LOG</span></div>
    <div id="todayDate" style="font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--text-muted);"></div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="stretches">Recovery</button>
    <button class="tab" data-tab="history">Archives</button>
  </div>

  <!-- TODAY VIEW -->
  <div id="view-today">
    <div class="card" style="text-align:center">
        <div id="timerDisplay" style="font-family: var(--mono); font-size: 40px; margin-bottom: 10px;">00:00:00</div>
        <button class="btn" id="timerBtn">Awaken</button>
    </div>

    <div class="card" style="display:flex; align-items:center; gap:20px;">
        <div id="bodyFigure" style="width:100px"></div>
        <div style="flex:1">
            <div style="font-family: var(--display); font-size: 18px; margin-bottom: 10px;">TARGETS HIT</div>
            <div id="workedSummary"></div>
        </div>
    </div>

    <div class="card">
        <div class="field"><label>Exercise Name</label><input type="text" id="exName" placeholder="e.g. Heavy Strike"></div>
        <div style="display:flex; gap:10px">
            <div class="field" style="flex:1"><label>Target</label>
                <select id="exBodyPart">
                    <option>Chest</option><option>Back</option><option>Shoulders</option><option>Arms</option><option>Legs</option><option>Core</option>
                </select>
            </div>
            <div class="field" style="flex:1"><label>Weight KG</label><input type="number" id="exWeight"></div>
        </div>
        <button class="btn" id="addExBtn">Log Combat Data</button>
    </div>
    <div id="todayList" style="margin-top:20px"></div>
  </div>

  <!-- STRETCHES VIEW -->
  <div id="view-stretches" class="hidden">
    <div id="stretchesContent"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" class="hidden">
    <div class="card" style="text-align:center">
        <div style="font-family: var(--mono); font-size: 10px; color: var(--text-muted);">HUNTER GRADE</div>
        <div id="globalRank" class="rank-display rank-e">E</div>
        <div id="rankSubtitle" style="font-family: var(--mono); font-size: 12px; color: var(--accent)">Calculating Power...</div>
    </div>
    <div class="card"><canvas id="muscleChart"></canvas></div>
    <div id="historyList"></div>
  </div>
</div>

<script>
// Data Setup
const STORAGE_KEY = 'gymlog_ultimate_storage';
const BODY_SVG = `<svg viewBox="0 0 200 440" xmlns="http://www.w3.org/2000/svg"><g transform-origin="100 430"><ellipse cx="100" cy="34" rx="19" ry="23" class="muscle"/><path d="M 90 70 Q 76 74 64 84 Q 78 82 100 80 Q 122 82 136 84 Q 124 74 110 70 Z" class="muscle" data-zone="Back"/><path d="M 64 84 Q 48 90 46 110 Q 50 122 68 118 Q 78 104 82 92 Q 76 84 64 84 Z" class="muscle" data-zone="Shoulders"/><path d="M 136 84 Q 152 90 154 110 Q 150 122 132 118 Q 122 104 118 92 Q 124 84 136 84 Z" class="muscle" data-zone="Shoulders"/><path d="M 82 90 Q 70 98 68 132 Q 76 148 98 148 L 99 104 Q 96 92 82 90 Z" class="muscle" data-zone="Chest"/><path d="M 118 90 Q 130 98 132 132 Q 124 148 102 148 L 101 104 Q 104 92 118 90 Z" class="muscle" data-zone="Chest"/><path d="M 46 110 Q 38 132 40 168 Q 50 174 60 170 Q 64 146 64 116 Q 56 110 46 110 Z" class="muscle" data-zone="Arms"/><path d="M 154 110 Q 162 132 160 168 Q 150 174 140 170 Q 136 146 136 116 Q 144 110 154 110 Z" class="muscle" data-zone="Arms"/><path d="M 84 150 Q 84 216 116 216 Q 116 150 100 150 Z" class="muscle" data-zone="Core"/><path d="M 86 248 Q 76 290 78 332 L 82 342 Q 96 346 99 342 L 99 250 Z" class="muscle" data-zone="Legs"/><path d="M 114 248 Q 124 290 122 332 L 118 342 Q 104 346 101 342 L 101 250 Z" class="muscle" data-zone="Legs"/></g></svg>`;

const stretchLibrary = {
  "Chest": ["Doorway Stretch", "Cobra Pose"],
  "Back": ["Child's Pose", "Cat-Cow"],
  "Shoulders": ["Cross-Arm Stretch", "Wall Slide"],
  "Arms": ["Tricep Overhead", "Wrist Extension"],
  "Legs": ["Pigeon Pose", "Quad Stretch"],
  "Core": ["Plank Transition", "Dead Bug"]
};

let state = { exercises: [], history: [], timerRunning: false, start: null };
let chart = null;

// Core Functions
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function load() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) state = JSON.parse(data);
    renderAll();
}

function getRank(w) {
    if (w >= 140) return 'S'; if (w >= 100) return 'A'; if (w >= 70) return 'B';
    if (w >= 40) return 'C'; if (w >= 20) return 'D'; return 'E';
}

function renderAll() {
    // Today's List
    document.getElementById('todayList').innerHTML = state.exercises.map(ex => `
        <div class="history-item"><b>${ex.name}</b> <span style="color:var(--accent)">${ex.weight}kg</span> <span style="float:right; font-family:var(--display)">${getRank(ex.weight)}</span></div>
    `).join('');

    // Mannequin
    const fig = document.getElementById('bodyFigure');
    fig.innerHTML = BODY_SVG;
    const worked = new Set(state.exercises.map(e => e.bodyPart));
    fig.querySelectorAll('.muscle').forEach(m => {
        if (worked.has(m.dataset.zone)) m.classList.add('active');
    });
    document.getElementById('workedSummary').innerHTML = Array.from(worked).map(p => `<span class="worked-tag">${p}</span>`).join('');

    // History List
    document.getElementById('historyList').innerHTML = state.history.map(s => `
        <div class="card">
            <div style="font-family:var(--mono); font-size:10px; color:var(--accent); margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:5px;">SESSION: ${new Date(s.date).toLocaleDateString()}</div>
            ${s.exercises.map(e => `<div style="margin-bottom:4px;">${e.name} <small style="color:var(--text-muted)">(${e.weight}kg)</small></div>`).join('')}
        </div>
    `).join('');

    // Global Rank
    let maxW = 0;
    state.history.forEach(s => s.exercises.forEach(e => { if(e.weight > maxW) maxW = e.weight; }));
    const r = getRank(maxW);
    const rg = document.getElementById('globalRank');
    rg.textContent = r; rg.className = `rank-display rank-${r.toLowerCase()}`;
    const titles = {S:'National Level Hunter', A:'Elite S-Ranker', B:'High Class', C:'Mid Class', D:'Novice', E:'Awakened'};
    document.getElementById('rankSubtitle').textContent = titles[r];
}

function updateChart() {
    const ctx = document.getElementById('muscleChart').getContext('2d');
    const parts = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core"];
    const counts = parts.map(p => {
        let c = 0;
        state.history.forEach(s => s.exercises.forEach(e => { if(e.bodyPart === p) c++; }));
        return c;
    });

    if (chart) chart.destroy();
    chart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: parts,
            datasets: [{ data: counts, backgroundColor: 'rgba(246, 170, 28, 0.2)', borderColor: '#F6AA1C', pointBackgroundColor: '#F6AA1C' }]
        },
        options: { 
            scales: { r: { grid: { color: 'rgba(255,255,255,0.05)'}, angleLines: {color:'rgba(255,255,255,0.1)'}, ticks: { display: false }, pointLabels: { color: '#d1b8b0', font: {size: 10} } } },
            plugins: { legend: { display: false } }
        }
    });
}

function renderStretches() {
    const worked = [...new Set(state.exercises.map(ex => ex.bodyPart))];
    const parts = worked.length > 0 ? worked : ["Legs", "Back"];
    let html = `<h2 style="font-family:var(--display); font-size:24px; margin: 20px 0;">RECOVERY PROTOCOL</h2>`;
    parts.forEach(p => {
        if (stretchLibrary[p]) {
            html += `<div style="color:var(--accent); font-family:var(--mono); font-size:12px; margin-top:15px;">${p.toUpperCase()}</div>`;
            stretchLibrary[p].forEach(s => {
                html += `<div class="history-item"><b>${s}</b><br><small style="color:var(--text-muted)">Hold for 45 seconds</small></div>`;
            });
        }
    });
    document.getElementById('stretchesContent').innerHTML = html;
}

// Events
document.getElementById('addExBtn').onclick = () => {
    const name = document.getElementById('exName').value;
    const weight = parseFloat(document.getElementById('exWeight').value) || 0;
    if (!name) return;
    state.exercises.push({ name, weight, bodyPart: document.getElementById('exBodyPart').value });
    save(); renderAll();
    document.getElementById('exName').value = "";
};

document.getElementById('timerBtn').onclick = () => {
    if (!state.timerRunning) {
        state.timerRunning = true;
        state.start = Date.now();
        document.getElementById('timerBtn').textContent = "Finish Raid";
        tick();
    } else {
        if (state.exercises.length > 0) {
            state.history.unshift({ date: new Date().toISOString(), exercises: [...state.exercises] });
            state.exercises = [];
        }
        state.timerRunning = false;
        document.getElementById('timerBtn').textContent = "Awaken";
        document.getElementById('timerDisplay').textContent = "00:00:00";
        save(); renderAll();
    }
};

function tick() {
    if (!state.timerRunning) return;
    const ms = Date.now() - state.start;
    document.getElementById('timerDisplay').textContent = new Date(ms).toISOString().substr(11, 8);
    setTimeout(tick, 1000);
}

document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        t.classList.add('active');
        const view = t.dataset.tab;
        document.getElementById('view-today').classList.toggle('hidden', view !== 'today');
        document.getElementById('view-stretches').classList.toggle('hidden', view !== 'stretches');
        document.getElementById('view-history').classList.toggle('hidden', view !== 'history');
        if (view === 'history') updateChart();
        if (view === 'stretches') renderStretches();
    }
});

load();
document.getElementById('todayDate').textContent = new Date().toDateString();
</script>
</body>
</html>
